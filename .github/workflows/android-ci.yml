name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Run unit tests
        run: gradle --no-daemon -PBETALINK_GOOGLE_WEB_CLIENT_ID="${{ vars.BETALINK_GOOGLE_WEB_CLIENT_ID }}" testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon -PBETALINK_GOOGLE_WEB_CLIENT_ID="${{ vars.BETALINK_GOOGLE_WEB_CLIENT_ID }}" assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: betalink-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
